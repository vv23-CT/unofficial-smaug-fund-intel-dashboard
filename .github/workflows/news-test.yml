name: news-test
on:
  push:
    branches: [news-preview]
permissions: {contents: read}
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: NEWS_FORCE=1 node tools/news.mjs /tmp/news.json
      - run: node -e "const n=require('/tmp/news.json');console.log(JSON.stringify(n.sources));for(const [t,v] of Object.entries(n.tokens))for(const i of v.items)console.log('ITEM',t,i.published_utc.slice(0,16),i.publisher,'|',i.headline.slice(0,150),'|',i.url)"
