name: news-test
on:
  push:
    branches: [news-preview]
    paths: [".github/workflows/news-test.yml"]
permissions: {contents: write}
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: news-preview}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: NEWS_FORCE=1 node tools/news.mjs news.json
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json && git commit -qm "Sample news reading (preview branch)" && git push -q origin HEAD:news-preview
