name: "Ping vv"

# A hand-run test that GitHub notifications reach vv's phone.
on:
  # Only the hand-run test ping is left: the morning and bell-day updates merge themselves,
  # and Claude notifies vv directly when something needs him.
  workflow_dispatch:

permissions:
  issues: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Test ping (run by hand)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL=$(gh issue create -R "$GITHUB_REPOSITORY" --assignee vv23-CT --title "Test ping from the dashboard" --body "@vv23-CT This is a test: if you got a notification for this, heads-ups and update pull requests will reach you too. Nothing to do; it closes itself.")
          gh issue close "$URL" -R "$GITHUB_REPOSITORY"
