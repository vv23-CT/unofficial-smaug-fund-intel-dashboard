name: market-test
on:
  push:
    branches: [market-preview]
    paths: [".github/workflows/market-test.yml"]
permissions: {contents: write}
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
        run: node tools/cmc.mjs
      - run: |
          node -e "const c=require('./cmc.json');console.log('GLOBAL',JSON.stringify(c.global))"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cmc.json && git commit -qm "Sample CoinMarketCap reading (preview branch)" && git push -q origin HEAD:market-preview || true
