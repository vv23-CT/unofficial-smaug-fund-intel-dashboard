name: "Chain reader - turnout and rooms (every 30 min)"

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: turnout
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Read turnout, rooms and prices from Robinhood Chain
        id: read
        run: node tools/chain_turnout.mjs chain.json
      - name: Re-render the share image (only when a room's backed tokens change)
        if: steps.read.outputs.og == '1'
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
          node tools/render_og.mjs
      - name: Keep the week in the share-link titles current
        run: node tools/sync_week.mjs
      - name: Official jobs and CPI numbers (BLS; only asks on release days)
        run: node tools/bls.mjs || echo 'BLS step skipped'
      - name: CoinMarketCap figures (free Basic plan; key in repo secrets)
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
        run: node tools/cmc.mjs || echo 'CoinMarketCap step skipped'
      - name: Bell recap and weekly housekeeping (after a bell only)
        id: recap
        run: node tools/bell_recap.mjs
      - name: Save
        run: |
          if git diff --quiet -- chain.json og.png index.html data.json econ.json cmc.json && ! git ls-files --others --exclude-standard | grep -q cmc.json && git ls-files --error-unmatch chain.json >/dev/null 2>&1; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chain.json og.png index.html data.json && (git add econ.json 2>/dev/null || true) && (git add cmc.json 2>/dev/null || true)
          git commit -m "Chain reading $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 10; done
          exit 1
      - name: Bell-day morning note (Fridays 8:30-10 AM ET, once)
        id: bellday
        run: node tools/bellday_note.mjs || echo 'Bell-day note skipped'
      - name: Send vv the bell-day note (GitHub notification)
        if: steps.bellday.outputs.note == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="${{ steps.bellday.outputs.note_title }}"
          if gh issue list -R "$GITHUB_REPOSITORY" --state all --search "\"$T\" in:title" --json title -q '.[].title' | grep -qxF "$T"; then echo "Already sent"; exit 0; fi
          URL=$(gh issue create -R "$GITHUB_REPOSITORY" --assignee vv23-CT --title "$T" --body-file /tmp/bellday.txt)
          gh issue close "$URL" -R "$GITHUB_REPOSITORY"
      - name: Send vv the recap (GitHub notification)
        if: steps.recap.outputs.recap == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WEEK="${{ steps.recap.outputs.recap_week }}"
          URL=$(gh issue create -R "$GITHUB_REPOSITORY" --assignee vv23-CT --title "Week $WEEK bell recap" --body "@vv23-CT $(cat /tmp/recap.txt)

          It's on the page under More → What changed, and the full table is under Bell results.")
          gh issue close "$URL" -R "$GITHUB_REPOSITORY"
