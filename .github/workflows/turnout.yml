name: "Chain reader - turnout and rooms (every 30 min)"

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: turnout
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Read turnout, rooms and prices from Robinhood Chain
        id: read
        run: node tools/chain_turnout.mjs chain.json
      - name: Re-render the share image (only when a room's backed tokens change)
        if: steps.read.outputs.og == '1'
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
          node tools/render_og.mjs
      - name: Save
        run: |
          if git diff --quiet -- chain.json og.png && git ls-files --error-unmatch chain.json >/dev/null 2>&1; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chain.json og.png
          git commit -m "Chain reading $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 10; done
          exit 1
      - name: Heads-up for vv (a room newly backs a token)
        if: steps.read.outputs.alerts != '0' && steps.read.outputs.alerts != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e '
            const a = require("/tmp/alerts.json");
            for (const x of a.alerts) console.log([x.fund, x.token, a.epoch, (x.share*100).toFixed(2), x.fill_on_file || ""].join("\t"));
          ' | while IFS=$'\t' read -r FUND TOKEN EPOCH SHARE FILL; do
            TITLE="Week $EPOCH: $FUND now backs $TOKEN"
            if gh issue list --state all --search "\"$TITLE\" in:title" --json title --jq '.[].title' | grep -qxF "$TITLE"; then continue; fi
            if [ -n "$FILL" ]; then NOTE="A fill time from $FILL is on file; send a fresh capture if it may have changed."; else NOTE="No fill time on file for $TOKEN in $FUND yet."; fi
            gh issue create --title "$TITLE" --body "$FUND's room now backs $TOKEN at $SHARE% of the fund (rebuilt from on-chain cards). $NOTE Please send a Match the room capture of $FUND (with every section expanded) so the dashboard can show how many Fridays $TOKEN takes to fill. Close this issue once it's done."
          done
